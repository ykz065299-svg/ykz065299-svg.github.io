    <style>
/* v106 — v103观感+加速： 首屏加速：系统字体；二页背景懒加载；去掉噪点滤镜 */
:root {
  --gold: #e7c16a;
  --gold-soft: #f3dfaa;
  --ink: #f4efe4;
  --muted: #c4bdae;
  --paper-ink: #2a2118;
  --night: #070b16;
  --veil: rgba(7, 11, 22, .55);
  --display: "ZCOOL XiaoWei", "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
  --body: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "PingFang SC", serif;
  --tube-w: clamp(140px, 42vmin, 200px);
  --tube-h: calc(var(--tube-w) * 1.6);
  --tube-stage-w: calc(var(--tube-w) * 1.2);
  --tube-stage-h: calc(var(--tube-h) * 1.19);
  --seer-w: clamp(118px, calc(var(--tube-w) * 0.92), 210px);
  --seer-x: clamp(18px, 6.5vw, 58px);
  --seer-y: calc(var(--seer-w) * 0.73);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-width: 100%;
  min-height: 100%;
  color: var(--ink);
  font-family: var(--body);
  background: var(--night, #070b16);
  overflow-x: hidden;
  position: relative;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
/* 第一页时冻结第二页，避免双页同时烧 GPU */
body:not(.ritual-visible) .page2-bg {
  visibility: hidden;
}

.world-bg {
  position: absolute;
  inset: 0 auto auto 0;
  width: 100vw;
  min-width: 100%;
  height: 200vh;
  height: 200dvh;
  z-index: 0;
  pointer-events: none;
  background: #070b16;
}
.page-bg {
  position: absolute;
  left: 0;
  right: 0;
  width: 100vw;
  min-width: 100%;
  height: 100vh;
  height: 100dvh;
  background-color: #070b16;
  background-repeat: no-repeat;
  background-size: cover;
}
.page1-bg {
  top: 0;
  background-image: url("cover.jpg?v=411");
  background-position: center center;
  background-size: cover;
}
/* 只在真正偏瘦的手机竖屏保留整张竖版封面；方屏/平板不套 contain。 */
@media (max-aspect-ratio: 3/4) {
  .page-bg.page1-bg {
    background-image: url("cover-mobile.jpg?v=411");
    /* 竖版海报已是 9:16；手机更瘦时 cover 会左右裁筒。contain 放下整张 */
    background-size: contain;
    background-position: center center;
    background-color: #1c140c;
  }
}
.page-seam {

    rgba(7, 11, 22, .5) 58%,

  );
}
.page2-bg {
  top: 100vh;
  top: 100dvh;
  /* 首屏不拉二页图；下滑后再加 .ritual-assets-ready */

}
body.ritual-assets-ready .page2-bg {

.page2-mood {

    linear-gradient(180deg, rgba(7,11,22,.58) 0%, transparent 22%, transparent 48%, rgba(8,5,3,.62) 100%),
    radial-gradient(ellipse 58% 42% at 50% 56%, rgba(255,150,60,.11), transparent 72%),
    radial-gradient(ellipse 36% 24% at 50% 14%, rgba(140,170,230,.07), transparent 70%);
}
.page2-dust {
  position: absolute;

    radial-gradient(1px 1px at 12% 28%, rgba(255,230,180,.35), transparent),

}

/* —— 第二页氛围道具（烟雾动画已移除） —— */
.page2-props {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
}

.prop-talisman {
  position: absolute;
  width: 18px;
  height: 34px;
  background: linear-gradient(180deg, rgba(245,230,190,.55), rgba(210,170,110,.28));
  border: 1px solid rgba(180,140,80,.35);

}
.prop-talisman.t1 { top: 18%; left: 8%; transform: rotate(-12deg); animation-delay: 0s; }
.prop-talisman.t2 { top: 28%; right: 9%; width: 14px; height: 28px; transform: rotate(9deg); animation-delay: 1.4s; opacity: .4; }
.prop-talisman.t3 { top: 12%; left: 22%; width: 12px; height: 24px; transform: rotate(-4deg); animation-delay: 2.6s; opacity: .35; }

.moon-shimmer {
  position: absolute;
  top: 6%;
  left: 14%;

}
.table-warmth {

    radial-gradient(ellipse 40% 50% at 18% 55%, rgba(255,140,50,.16), transparent 70%),
    radial-gradient(ellipse 36% 46% at 82% 58%, rgba(255,110,40,.12), transparent 72%),
    radial-gradient(ellipse 50% 40% at 50% 70%, rgba(255,160,70,.08), transparent 75%);

}

@keyframes talismanSway {
  0%, 100% { translate: 0 0; rotate: -8deg; }
  50% { translate: 0 8px; rotate: 6deg; }
}
@keyframes moonBreath {
  0%, 100% { opacity: .45; transform: scale(1); }
  50% { opacity: .8; transform: scale(1.08); }
}

  0%, 100% { opacity: .75; }

}

.audio-toggle {

  top: max(14px, env(safe-area-inset-top));
  right: max(14px, env(safe-area-inset-right));
  z-index: 8;
  border: 1px solid rgba(231,193,106,.38);

  border-color: rgba(231,193,106,.65);

}

.world {

  z-index: 2;

  max-width: none;
  margin: 0;
}

.page {
  position: relative;
  width: 100%;
  min-width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.page[hidden] {
  display: none !important;
}

.page-cover {
  justify-content: flex-end;
  padding: 0 0 max(28px, env(safe-area-inset-bottom));
}
.cover-spacer { flex: 1; }
.scroll-cue {
  margin: 0 auto;
  width: fit-content;
  color: rgba(231,193,106,.88);
  letter-spacing: .34em;
  text-indent: .34em;
  font-size: .76rem;
  padding: 10px 20px;
  border: 1px solid rgba(231,193,106,.3);
  border-radius: 999px;

  text-shadow: 0 2px 12px rgba(0,0,0,.85);
  animation: cuePulse 2.8s ease-in-out infinite;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
@keyframes cuePulse {
  0%, 100% { opacity: .42; transform: translateY(0) scale(1); }
  50% { opacity: 1; transform: translateY(7px) scale(1.03); }
}
.page-ritual.slip-retracting .slip-scroll {
  opacity: 0;
  transform: translate3d(-50%, -50%, 0) scale(.08);
  transition: opacity .32s ease, transform .32s ease;
}
.page-ritual.slip-retracting .ritual {
  opacity: .55;
  transition: opacity .35s ease;
}

.page-ritual {
  position: relative;
  justify-content: flex-start;
  align-items: center;
  padding: 16px max(10px, env(safe-area-inset-right)) 22px max(10px, env(safe-area-inset-left));
  text-align: center;
  /* 整页作为签的定位坐标系 */
  min-height: 100vh;
  min-height: 100dvh;
}
.page-ritual.has-slip .phase {
  opacity: .28;
}
.page-ritual.has-slip .story-line {
  opacity: .22;
}
.page-ritual.has-slip .ritual {
  opacity: .18;
  pointer-events: none;
  transition: opacity .55s ease;
}
.page-ritual.has-slip .ritual-footer {
  opacity: 0;
  pointer-events: none;
  height: 0;
  padding: 0;
  overflow: hidden;
}

.story-head {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin: 10px 12px 0;
  min-height: 2.2em;
  pointer-events: none;
}
.phase {
  margin: 0;
  min-height: 1.35em;
  color: #fff8e8;
  letter-spacing: .28em;
  text-indent: .28em;
  font-size: clamp(1.05rem, 2.8vw, 1.35rem);
  font-weight: 700;
  text-shadow: 0 2px 8px rgba(0,0,0,.55);
}
.story-line {
  margin: 0;
  max-width: min(92vw, 420px);
  min-height: 1.2em;
  text-align: center;
  color: rgba(255, 244, 220, .88);
  font-size: clamp(.82rem, 2.1vw, .95rem);
  letter-spacing: .1em;
  line-height: 1.45;
  text-shadow: 0 2px 8px rgba(0,0,0,.5);
}
.page-ritual.is-drawing .story-line,
.page-ritual.is-casting .story-line {
  opacity: 0;
}
.page-ritual.is-drawing .phase,
.page-ritual.is-casting .phase {
  opacity: 1;
}

/* 幕次金字：竖排 · 神秘淡现（克制，不炫光） */
.act-flash {
  position: absolute;
  left: 50%;
  top: 36%;
  transform: translate3d(-50%, -50%, 0);
  z-index: 30;
  margin: 0;
  padding: .15em 0;
  color: rgba(243, 223, 170, .92);
  font-size: clamp(2.4rem, 9vw, 3.5rem);
  font-weight: 700;
  writing-mode: vertical-rl;
  text-orientation: upright;
  letter-spacing: .45em;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  text-shadow:
    0 2px 12px rgba(0, 0, 0, .9),
    0 0 14px rgba(231, 193, 106, .22);
  filter: none;
  will-change: opacity, transform;
}
.act-flash::before {
  display: none;
}
.act-flash.show,
.act-flash.show.punch {
  animation: actMysticIn .9s ease forwards;
}
.act-flash.show::before,
.act-flash.show.punch::before {
  animation: none;
}
@keyframes actMysticIn {
  0% {
    opacity: 0;
    transform: translate3d(-50%, -46%, 0);
  }
  20% {
    opacity: 1;
    transform: translate3d(-50%, -50%, 0);
  }
  68% {
    opacity: 1;
    transform: translate3d(-50%, -50%, 0);
  }
  100% {
    opacity: 0;
    transform: translate3d(-50%, -50%, 0);
  }
}
.ritual.is-shaking .tube-stage {
  transition: none !important;
}
.ritual.is-shaking .kanshan-seer,
.ritual.is-shaking .kanshan-seer.casting,
.kanshan-seer.motion-active {
  animation: none;
  filter: none !important;
}
.ritual.is-shaking .tube {
  filter: none !important;
}
.ritual.is-shaking .tube-glow {
  opacity: 0;
}
@keyframes actGoldFlash {
  0%, 100% { opacity: 0; }
}
@keyframes actGoldPunch {
  0%, 100% { opacity: 0; }
}
@keyframes actGoldBurst {
  0%, 100% { opacity: 0; }
}
.page-ritual.act-flashing .tube-stage {
  filter: none;
}
.page-ritual.act-flashing .kanshan-seer {
  filter: none;
}

.ritual {
  position: relative;
  width: 100%;
  flex: 1 1 auto;
  min-height: clamp(280px, 48dvh, 560px);
  margin: 0 auto;
  z-index: 2;
}

/* 签筒旁：举签戊（斜举一支，身上有晨光体积） */
.kanshan-seer {
  position: absolute;
  left: calc(50% + var(--seer-x));
  right: auto;
  bottom: calc(50% - var(--seer-y));
  top: auto;
  width: var(--seer-w);
  height: auto;
  overflow: visible;
  z-index: 4;
  pointer-events: none;
  transform: translateZ(0);
  transform-origin: 54% 96%;
  filter:
    drop-shadow(-8px -4px 12px rgba(255, 186, 96, .26))
    drop-shadow(18px 28px 22px rgba(42, 24, 10, .16));
  animation: kanshanIdleFloat 8.6s ease-in-out infinite;
  transition: opacity .6s ease, transform .6s cubic-bezier(.22, .8, .28, 1);
  backface-visibility: hidden;
}
@keyframes kanshanIdleFloat {
  0%, 100% { transform: translate3d(0, 0, 0) rotate(-0.7deg); }
  50% { transform: translate3d(-2px, -4px, 0) rotate(0.55deg); }
}
.kanshan-seer.casting,
.kanshan-seer.motion-active {
  animation: none;
  transition: none;
}
.kanshan-seer.beating {
  animation: none !important;
}
.kanshan-seer.blessing {
  animation: kanshanBless 1.05s cubic-bezier(.22, .82, .28, 1) 1 forwards;
  transition: none;
}
.kanshan-seer.exiting {
  animation: none !important;
  opacity: 0;
  pointer-events: none;
}
.page-ritual.has-slip .kanshan-seer {
  opacity: 0;
  transform: translate3d(8px, 5px, 0) scale(.98);
  animation: none !important;
  pointer-events: none;
  transition: opacity .7s cubic-bezier(.33,.08,.2,1), transform .7s cubic-bezier(.33,.08,.2,1);
}
.page-ritual.act-flashing .kanshan-seer {
  filter: none;
}
@keyframes kanshanBless {
  0%   { transform: translate3d(0, 2px, 0) rotate(-0.3deg); }
  48%  { transform: translate3d(-3px, -5px, 0) rotate(-1.6deg); }
  100% { transform: translate3d(0, 0, 0) rotate(-0.35deg); }
}
.kanshan-seer.casting .kanshan-aura {
  animation-duration: 2.4s;
  opacity: .72;
}
.kanshan-seer.casting .kanshan-aura.ring {
  animation-duration: 7s;
  opacity: .5;
  border-color: rgba(255,210,140,.38);
}
.kanshan-aura {
  position: absolute;
  left: 50%;
  top: 46%;
  width: 78%;
  height: 54%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(255,180,70,.22) 0%, rgba(255,120,40,.08) 42%, transparent 70%);
  /* 不用 blur filter，改用更软的渐变，少一层昂贵合成 */
  filter: none;
  mix-blend-mode: screen;
  animation: kanshanAura 3.6s ease-in-out infinite;
  z-index: 0;
  pointer-events: none;
  opacity: .55;
}
.kanshan-aura.ring {
  display: none; /* 椭圆描边易显“框”，去掉 */
}
.kanshan-seer-art {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 994 / 1366;
  object-fit: contain;
  object-position: 50% bottom;
  -webkit-user-drag: none;
  user-select: none;
  background: transparent;
  box-shadow: none;
  transform: translateZ(0);
  filter: none;
}
.kanshan-seer.blessing .kanshan-seer-art {
  animation: heldStickPresent 1.05s cubic-bezier(.22, .82, .28, 1) 1;
}
@keyframes heldStickPresent {
  0%   { transform: rotate(0deg) translate3d(0, 2px, 0); }
  42%  { transform: rotate(-2.2deg) translate3d(-3px, -3px, 0); }
  100% { transform: rotate(0deg) translate3d(0, 0, 0); }
}
.ritual.is-shaking .kanshan-seer-art,
.kanshan-seer.motion-active .kanshan-seer-art,
.kanshan-seer.casting .kanshan-seer-art {
  animation: none;
  filter: none !important;
}
.kanshan-seer-caption {
  display: none; /* 分层场景不再叠字 */
}

@keyframes kanshanIdle {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(0, -2px, 0) scale(1.02); }
}
@keyframes kanshanFloat {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(0, -2px, 0) scale(1.035); }
}
@keyframes kanshanAura {
  0%, 100% { opacity: .4; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: .7; transform: translate(-50%, -50%) scale(1.05); }
}
@keyframes kanshanRing {
  0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
}

@media (max-width: 420px) {
  :root {
    --seer-x: clamp(16px, 5.2vw, 32px);
  }
  .act-flash {
    letter-spacing: .22em;
    font-size: clamp(1.55rem, 7.2vw, 2.1rem);

.ritual-bottom {

  z-index: 4;
  width: 100%;
  margin-top: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.ritual-footer {

  z-index: 4;
  width: 100%;
  padding: 8px max(8px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  margin-top: 0;
}
.ritual-disclaimer {
  display: block;
  width: 100%;
  margin: 8px 0 0;
  padding: 0 8px;
  box-sizing: border-box;
  color: rgba(244, 232, 208, .78);
  font-size: clamp(.48rem, 2.15vw, .66rem);
  line-height: 1.45;
  letter-spacing: .02em;
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 2px 12px rgba(0, 0, 0, .9);
  pointer-events: none;
}
.slip-actions .ritual-disclaimer {
  margin-top: 10px;
  padding: 0 4px;
  white-space: normal;
}

/* —— 签筒 —— */
.tube-stage {
  position: absolute;
  left: 50%;
  top: 52%;
  transform: translate3d(-50%, -50%, 0);
  width: var(--tube-stage-w);
  height: var(--tube-stage-h);
  z-index: 3;
  display: grid;
  place-items: center;
  transition: opacity .5s ease, transform .5s ease, filter .5s ease;
  cursor: pointer;
}
.tube-stage.leaving {
  opacity: 0;
  transform: translate3d(-50%, -46%, 0) scale(.94);
  filter: none;
  pointer-events: none;
  transition:
    opacity .72s cubic-bezier(.33, .08, .25, 1),
    transform .72s cubic-bezier(.33, .08, .25, 1);
}

.fate-ring {
  position: absolute;
  width: 236px;
  height: 236px;
  border-radius: 50%;
  border: 1px solid rgba(231,193,106,.22);
  box-shadow:
    0 0 28px rgba(231,193,106,.1),
    inset 0 0 22px rgba(231,193,106,.05);
  animation: orbitSpin 48s linear infinite;
  z-index: 0;
  pointer-events: none;
}
.fate-ring::before {
  content: "";
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  border: 1px dashed rgba(231,193,106,.15);
}
.fate-ring::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1px solid rgba(231,193,106,.07);
}
.fate-ring span {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1.2em;
  margin: -.6em 0 0 -.6em;
  font-family: var(--display);
  font-size: .88rem;
  color: rgba(255, 220, 140, .7);
  text-shadow: 0 0 10px rgba(255,200,100,.35), 0 2px 6px rgba(0,0,0,.7);
  transform:
    rotate(calc(var(--i) * 30deg))
    translateY(-108px)
    rotate(calc(var(--i) * -30deg));
  animation: runeGlow 3.8s ease-in-out infinite;
  animation-delay: calc(var(--i) * .12s);
}
@keyframes orbitSpin { to { transform: rotate(360deg); } }
@keyframes runeGlow {
  0%, 100% { opacity: .35; }
  50% { opacity: 1; }
}

.tube {
  position: relative;
  width: var(--tube-w);
  height: var(--tube-h);
  margin-bottom: calc(var(--tube-w) * 0.18);
  z-index: 2;
  transform-origin: 50% 92%;
  transform: translateZ(0);
  animation: tubeIdleBreath 5.2s ease-in-out infinite;
  filter: drop-shadow(12px 10px 14px rgba(40, 22, 8, .42));
  cursor: pointer;
}
.tube.shaking {
  animation: none;
  filter: drop-shadow(0 10px 12px rgba(40, 22, 8, .38));
}
@keyframes tubeIdleBreath {
  0%, 100% { transform: translate3d(0, 0, 0) rotate(-0.12deg); }
  50% { transform: translate3d(0, -2.2px, 0) rotate(0.12deg); }
}
.tube-glow {
  position: absolute;
  left: 50%;
  bottom: 6%;
  width: 78%;
  height: 32%;
  transform: translateX(-50%);
  background: radial-gradient(ellipse, rgba(255, 180, 70, .35), transparent 72%);
  filter: blur(12px);
  pointer-events: none;
  z-index: 0;
  opacity: .85;
  transition: opacity .35s ease, transform .35s ease;
}
.tube.shaking .tube-glow {
  opacity: 1;
  transform: translateX(-50%) scale(1.12);
  background: radial-gradient(ellipse, rgba(255, 200, 90, .5), transparent 70%);
}
.tube-art {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  display: block;
  pointer-events: none;
  background: transparent;
  -webkit-user-drag: none;
  user-select: none;
  /* 禁止破图 alt 文字 */
  color: transparent;
  font-size: 0;
}
@keyframes tubeIdle {
  0%, 100% { transform: rotate(-0.8deg) translate3d(0,0,0); }
  50% { transform: rotate(0.9deg) translate3d(0,-2px,0); }
}

.tube-label {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  white-space: nowrap;
  color: #fff6dc;
  letter-spacing: .28em;
  text-indent: .28em;
  font-size: clamp(1.05rem, 3.4vw, 1.28rem);

  -webkit-text-stroke: .55px rgba(28, 14, 6, .92);
  paint-order: stroke fill;
  text-shadow:
    0 1px 0 rgba(20, 8, 2, .95),
    0 2px 4px rgba(0, 0, 0, .9),
    0 0 12px rgba(0, 0, 0, .75);
  opacity: 1;
  transition: opacity .45s ease;
}
.page-ritual.is-casting .tube-label {
  opacity: .35;
}

.emerging {
  position: absolute;
  left: 50%;
  top: 2%;
  transform: translateX(-50%);
  z-index: 5;
  height: calc(var(--tube-h) * 0.71);
  width: calc(var(--tube-w) * 0.18);
  pointer-events: none;
  opacity: 1;
  transition: opacity .42s cubic-bezier(.33, .08, .25, 1);
}
.emerging.fade-out {
  opacity: 0;
}
.emerging-stick {
  position: relative;
  width: 18px;
  height: 100%;
  margin: 0 auto;
  transform-origin: 50% 100%;
  transform: scaleY(0.06) translate3d(0, 8px, 0);
  transition: transform .86s cubic-bezier(.18, .82, .22, 1);
  background: linear-gradient(180deg, #ffe9a8 0%, #f0c45a 42%, #d4a03a 100%);
  border-radius: 3px 3px 2px 2px;
  box-shadow:
    0 0 16px rgba(255, 196, 80, .7),
    0 0 28px rgba(255, 170, 50, .35),
    0 4px 10px rgba(0, 0, 0, .28);
}
.emerging.show .emerging-stick {
  transform: scaleY(1) translate3d(0, 0, 0);
}

/* —— 签面：签名 + 签文（竖排纸笺） —— */
.slip-scroll {
  --slip-h: auto;
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(244px, 70vw, calc(72dvh * 508 / 994));
  height: auto;
  display: flex;
  flex-direction: column;
  transform: translate3d(-50%, -50%, 0) scale(0.08);
  transform-origin: center center;
  opacity: 0;
  pointer-events: none;
  z-index: 6;
  overflow: visible;
  border-radius: 12px;
  transition:
    transform .72s cubic-bezier(.2, .78, .16, 1),
    opacity .36s ease;
  backface-visibility: hidden;
}
.slip-scroll.visible {
  opacity: 1;
  transform: translate3d(-50%, -50%, 0) scale(1, 1);
  pointer-events: auto;
}

/* v3：测量态 — 真实排版取高，不参与动画 */
.slip-scroll.measuring {
  visibility: hidden !important;
  opacity: 0 !important;
  pointer-events: none !important;
  transform: translate3d(-50%, -50%, 0) scale(1) !important;
  height: auto !important;
  overflow: visible !important;
  transition: none !important;
}
.slip-scroll.measuring .slip-paper,
.slip-scroll.measuring .slip-read-layer,
.slip-scroll.measuring .slip-actions {
  opacity: 1 !important;
  transition: none !important;
}

/* v4：内容完全放下时不出现滚动条 */

}
.slip-scroll.glowing .scroll-glow { opacity: 1; }
.slip-scroll.visible {

}

.scroll-glow {

.scroll-body {

  background:
    linear-gradient(180deg, rgba(255, 243, 210, .22), transparent 42%),

  box-shadow:
    0 0 0 2px #6b1c14,
    0 0 0 3px #e6bb70,

}
.slip-read-btn::after {
  content: "";

    0 0 0 2px #6b1c14,
    0 0 0 3px #e6bb70,
    inset 0 2px 6px rgba(40, 8, 6, .35);
}
.slip-read-btn:focus {

}
.slip-read-btn:focus-visible {
  outline: 2px solid #e6bb70;
  outline-offset: 3px;
}
.slip-scroll.visible.revealed:not(.is-read) {
  top: max(14%, env(safe-area-inset-top));
  transform: translate3d(-50%, 0, 0) scale(1);
}
.slip-scroll.visible.revealed.is-read {
  top: max(10px, env(safe-area-inset-top));
  bottom: max(8px, env(safe-area-inset-bottom));
  max-height: calc(100dvh - 18px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  transform: translate3d(-50%, 0, 0) scale(1);
  overflow: hidden;
  overscroll-behavior: none;
}
.slip-scroll.has-art.is-read {
  width: min(300px, 82vw, calc((100dvh - 320px) * 1085 / 1450));
}
body:has(.slip-scroll.is-read) {
  overflow: hidden;
  overscroll-behavior: none;
}
.page-ritual.has-slip:has(.slip-scroll.is-read) .story-head {
  visibility: hidden;
  height: 0;
  min-height: 0;
  margin: 0;
  overflow: hidden;
}
.page-ritual.has-slip:has(.slip-scroll.is-read) .ritual {

  opacity: 0;
  margin: 0;
  padding: 0 8px;

  transition: max-height .45s ease, opacity .35s ease, margin .35s ease;
}
.slip-scroll.is-read .slip-meaning {

  margin: 4px 0 6px;

  pointer-events: auto;
  background: none;
  border-radius: 0;

.slip-scroll.is-read .slip-meaning-kicker {

}
.slip-scroll.is-read .slip-meaning-text {

}
.slip-scroll.is-read .slip-actions {

}

/* 大屏 / 方屏：签与签解组成一组，避免纵向被拉成断裂的三段。 */
@media (min-width: 760px) and (min-height: 640px) {
  .slip-scroll.visible.revealed.is-read {
    top: 50%;
    bottom: auto;
    width: min(820px, 88vw);
    max-height: calc(100dvh - 36px);
    transform: translate3d(-50%, -50%, 0) scale(1);
    overflow: visible;
  }
  .slip-scroll.has-art.is-read .scroll-inner {
    display: grid;
    grid-template-columns: minmax(300px, 40dvh) minmax(380px, 520px);
    grid-template-areas:
      "card meaning"
      "card actions";
    align-items: center;
    justify-content: center;
    column-gap: clamp(28px, 5vw, 64px);
    row-gap: 10px;
  }
  .slip-scroll.has-art.is-read .slip-paper {
    grid-area: card;
    width: 100%;
  }
  .slip-scroll.has-art.is-read .slip-meaning {
    grid-area: meaning;
    width: 100%;
    align-self: end;
    margin: 0;
    padding: 20px 26px;
    background: #2a2118;
    border: 1px solid #b9924e;
    border-radius: 16px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, .26);
  }
  .slip-scroll.has-art.is-read .slip-actions {
    grid-area: actions;
    width: min(100%, 390px);
    justify-self: center;
    align-self: start;
    margin: 0;
  }
  .slip-scroll.has-art.is-read .slip-meaning-text {
    font-size: clamp(1rem, 1.7vw, 1.14rem);
    line-height: 1.7;
  }
  .slip-scroll.has-art.is-read .slip-ai-btn {

    border-color: #e6bb70;

    box-shadow: 0 4px 14px rgba(0, 0, 0, .22);

    white-space: nowrap;
    overflow: visible;
    font-size: clamp(.62rem, .78vw, .76rem);
    letter-spacing: 0;
  }

  z-index: 40;

  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(10, 7, 5, .72);
}
.share-backup[hidden] { display: none !important; }
.share-backup-card {
  width: min(420px, 100%);
  max-height: min(88dvh, 720px);
  overflow: auto;
  padding: 22px 18px 18px;
  border-radius: 16px;
  background: #1c1612;
  color: #f4eee6;
  text-align: center;
  box-shadow: 0 18px 40px rgba(0,0,0,.4);
}
.share-backup-kicker {
  margin: 0 0 12px;
  color: #e6bb70;
  letter-spacing: .28em;
  text-indent: .28em;
}
.share-backup-card img {
  display: block;
  width: min(220px, 64%);
  height: auto;
  margin: 0 auto 14px;
  border-radius: 6px;
}
.share-backup-hint {
  margin: 0 0 10px;
  color: rgba(244, 238, 230, .78);
  font-size: .86rem;
  line-height: 1.6;
}
.share-backup-text {
  margin: 0 0 14px;
  padding: 10px 12px;
  text-align: left;
  white-space: pre-wrap;
  color: #fff8ec;
  background: rgba(0,0,0,.28);
  border-radius: 8px;
  font-family: inherit;
  font-size: .88rem;
  line-height: 1.65;
}
.share-backup-card button {
  appearance: none;
  width: 100%;
  margin-top: 8px;
  padding: 11px 12px;
  border-radius: 999px;
  font-family: inherit;
  font-size: .95rem;
  letter-spacing: .12em;
  cursor: pointer;
}
.share-backup-card .share-go {
  color: #1a1208;
  background: linear-gradient(180deg, #f6e4b4, #e4bc62);
  border: none;
}
.share-backup-card .share-copy,
.share-backup-card .share-dl {
  color: #f4efe4;
  background: rgba(18, 14, 10, .42);
  border: 1px solid rgba(244, 239, 228, .28);
}
.share-backup-card .share-cancel {
  color: rgba(244, 238, 230, .7);
  background: transparent;
  border: none;
}

.draw-btn {
  position: relative;
  appearance: none;
  border: 1px solid rgba(231,193,106,.55);
  background:
    linear-gradient(180deg, rgba(255,220,150,.08), transparent 40%),
    linear-gradient(180deg, #3f2e14, #1a1208);
  color: var(--gold-soft);
  font-family: inherit;
  font-size: clamp(.95rem, 2.6vw, 1.05rem);
  letter-spacing: .46em;
  text-indent: .46em;
  padding: 14px max(28px, 8vw);
  max-width: min(420px, calc(100% - 8px));
  border-radius: 999px;
  cursor: pointer;
  overflow: hidden;
  box-shadow:
    0 12px 34px rgba(0,0,0,.42),
    0 0 22px rgba(231,193,106,.14),
    inset 0 1px 0 rgba(255,240,200,.12);
  z-index: 4;
  transition: transform .2s ease, box-shadow .2s ease;
}
.draw-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow:
    0 14px 36px rgba(0,0,0,.46),
    0 0 26px rgba(231,193,106,.2),
    inset 0 1px 0 rgba(255,240,200,.14);
}
.draw-btn:disabled { cursor: wait; opacity: .88; }
.btn-glow {
  position: absolute;
  inset: -40%;
  background: linear-gradient(120deg, transparent 30%, rgba(255,240,200,.16) 50%, transparent 70%);
  animation: sheen 3.2s ease-in-out infinite;
}
@keyframes sheen {
  0%, 55% { transform: translateX(-70%); }
  80%, 100% { transform: translateX(70%); }
}

.hint {
  margin: 12px 0 0;
  color: rgba(236, 228, 210, .92);
  font-size: .78rem;
  letter-spacing: .08em;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .85), 0 0 10px rgba(0, 0, 0, .55);
  min-height: 1.35em;
  transition: opacity .35s ease;
}
.page-ritual.is-casting .hint,
.page-ritual.is-drawing .hint {
  color: rgba(231,193,106,.82);
}
.source { display: none !important; }

@media (max-width: 720px) {
  .page-cover .scroll-cue {

  .page2-bg { background-position: 50% 40%; }
  .kanshan-seer-art { filter: none; }
  .audio-toggle,
  .scroll-cue { backdrop-filter: none; }
  .slip-scroll {
    width: min(244px, 76vw, calc(68dvh * 508 / 994));
  }
  .slip-scroll.has-art {
    width: min(320px, 88vw, calc(62dvh * 1085 / 1450));
  }
  .slip-paper {
    min-height: 0;
  }
}

@media (min-width: 900px) and (orientation: landscape) {
  :root {
    --tube-w: clamp(180px, 22vh, 220px);
    --seer-w: clamp(160px, calc(var(--tube-w) * 0.96), 230px);
  }
}

@media (max-height: 620px) {

  .hint { margin-top: 8px; }

@media (max-width: 360px) {

  }
  .scroll-cue {
    letter-spacing: .22em;

    padding: 8px 14px;
  }
}
