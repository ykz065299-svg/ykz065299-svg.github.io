<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>拿签对照 · 看山今日一签</title>
<style>
:root { --song: "Songti SC","STSong","SimSun","Noto Serif SC",serif; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: var(--song); color: #f3ebe0; background: #1c1612; }
body { padding: 28px 20px 72px; }
.intro { max-width: 1180px; margin: 0 auto 24px; }
.intro h1 { margin: 0 0 8px; font-size: 1.5rem; letter-spacing: .16em; }
.intro p { margin: 0; color: rgba(243,235,224,.68); font-size: .88rem; line-height: 1.7; }
.wall { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px 18px; }
.shot { display: flex; flex-direction: column; gap: 10px; }
.shot h2 { margin: 0; font-size: .9rem; letter-spacing: .12em; }
.shot h2 b { margin-right: 8px; }
.shot .note { margin: 0; font-size: .76rem; color: rgba(243,235,224,.5); line-height: 1.55; }
.pair { display: flex; gap: 10px; align-items: flex-end; padding: 10px; border-radius: 10px; background: #2a1c14; }
.pair img.scene { width: 150px; height: auto; border-radius: 6px; }
.pair img.zoom { width: 118px; height: 118px; object-fit: cover; border-radius: 6px; }
</style>
</head>
<body>
<div class="intro">
  <h1>拿签对照 · 八版</h1>
  <p>都是官方看山原图 + 局部叠金签，没有重画角色。左边是二页里的样子，右边是爪子特写。点一个编号告诉我用哪版。</p>
</div>
<div class="wall">
<div class="shot" id="甲">
  <h2><b>甲</b>穿爪心</h2>
  <p class="note">签从爪心穿过，中间被三瓣挡住，只上下露头</p>
  <div class="pair">
    <img class="scene" src="art/hold-studio/甲-scene.webp" alt="甲" />
    <img class="zoom" src="art/hold-studio/甲-z.webp" alt="" />
  </div>
</div>
<div class="shot" id="乙">
  <h2><b>乙</b>指缝夹</h2>
  <p class="note">三瓣爪留出指缝，签从缝里穿过去</p>
  <div class="pair">
    <img class="scene" src="art/hold-studio/乙-scene.webp" alt="乙" />
    <img class="zoom" src="art/hold-studio/乙-z.webp" alt="" />
  </div>
</div>
<div class="shot" id="丙">
  <h2><b>丙</b>斜握</h2>
  <p class="note">签斜着穿过爪垫，像捏一支笔</p>
  <div class="pair">
    <img class="scene" src="art/hold-studio/丙-scene.webp" alt="丙" />
    <img class="zoom" src="art/hold-studio/丙-z.webp" alt="" />
  </div>
</div>
<div class="shot" id="丁">
  <h2><b>丁</b>竖捏</h2>
  <p class="note">短粗一截，大半藏在三瓣里</p>
  <div class="pair">
    <img class="scene" src="art/hold-studio/丁-scene.webp" alt="丁" />
    <img class="zoom" src="art/hold-studio/丁-z.webp" alt="" />
  </div>
</div>
<div class="shot" id="戊">
  <h2><b>戊</b>签在爪前</h2>
  <p class="note">签大部分在爪前面，右侧一瓣压住</p>
  <div class="pair">
    <img class="scene" src="art/hold-studio/戊-scene.webp" alt="戊" />
    <img class="zoom" src="art/hold-studio/戊-z.webp" alt="" />
  </div>
</div>
<div class="shot" id="己">
  <h2><b>己</b>横握</h2>
  <p class="note">签横过爪垫，三瓣压在签上</p>
  <div class="pair">
    <img class="scene" src="art/hold-studio/己-scene.webp" alt="己" />
    <img class="zoom" src="art/hold-studio/己-z.webp" alt="" />
  </div>
</div>
<div class="shot" id="庚">
  <h2><b>庚</b>长签</h2>
  <p class="note">签更长，围巾下到爪下都看见</p>
  <div class="pair">
    <img class="scene" src="art/hold-studio/庚-scene.webp" alt="庚" />
    <img class="zoom" src="art/hold-studio/庚-z.webp" alt="" />
  </div>
</div>
<div class="shot" id="辛">
  <h2><b>辛</b>爪前全露</h2>
  <p class="note">签在爪子前面，只有臂杆压住上端</p>
  <div class="pair">
    <img class="scene" src="art/hold-studio/辛-scene.webp" alt="辛" />
    <img class="zoom" src="art/hold-studio/辛-z.webp" alt="" />
  </div>
</div>
</div></body></html>
