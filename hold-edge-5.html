<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>看山黑边 · 再五版</title>
<style>
:root { --song: "Songti SC","STSong","SimSun","Noto Serif SC",serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #12100e; color: #f4eee6; font-family: var(--song); }
body { padding: 24px 16px 80px; }
.intro { max-width: 1080px; margin: 0 auto 22px; }
.intro h1 { margin: 0 0 8px; font-size: 1.45rem; letter-spacing: .12em; }
.intro p { margin: 0 0 8px; color: #c9b8a4; font-size: 1.05rem; line-height: 1.75; }
.wall { max-width: 1080px; margin: 0 auto; display: grid; gap: 26px; }
.shot { padding: 16px; border-radius: 14px; background: #1c1815; }
.shot h2 { margin: 0 0 10px; font-size: 1.2rem; }
.shot h2 b { margin-right: 10px; color: #f0c27a; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row img { width: 100%; height: auto; image-rendering: pixelated; background: #d6c4a6; border-radius: 8px; }
.cap { margin: 6px 0 0; font-size: .82rem; color: #9a8570; }
.under { margin-top: 10px; display: grid; grid-template-columns: 160px 1fr; gap: 10px; }
.under img { width: 100%; height: auto; border-radius: 8px; }
</style>
</head>
