:root { --song: "Songti SC","STSong","SimSun","Noto Serif SC",serif; }

html, body { margin: 0; background: #14110e; color: #f4eee6; font-family: var(--song); }
body { padding: 22px 14px 90px; }
.intro { max-width: 1280px; margin: 0 auto 18px; }
.intro h1 { margin: 0 0 8px; font-size: 1.4rem; letter-spacing: .14em; }

.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tools button, .tools a {

  font: inherit; font-size: .78rem; letter-spacing: .08em; text-decoration: none;
}
.tools button.on { background: #8a2c1c; border-color: #8a2c1c; }
.wall {
  max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 18px 12px;
}
.shot { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.shot h2 { margin: 0; font-size: .78rem; font-weight: 500; letter-spacing: .06em; color: rgba(243,235,224,.78); }
.shot h2 b { font-weight: 700; color: #f0c27a; margin-right: 6px; }
.shot.is-now h2 b { color: #7dcea0; }
.shot.is-old h2 b { color: #e07a6a; }
.phone {
  width: 100%; aspect-ratio: 390 / 760;
  border-radius: 10px; overflow: hidden; position: relative;
  background:
    radial-gradient(ellipse 80% 46% at 50% 18%, rgba(90,62,28,.28), transparent 70%),
    linear-gradient(180deg, #3a2a1c 0%, #1a140f 70%);
}
.stage {
  position: absolute; inset: 6% 8% 8%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.stack { width: var(--card); max-width: 100%; display: flex; flex-direction: column; align-items: stretch; gap: var(--stack); }
.paper { position: relative; width: 100%; line-height: 0; filter: drop-shadow(0 8px 14px rgba(0,0,0,.36)); }
.paper img { width: 100%; height: auto; display: block; }
.layer { display: flex; flex-direction: column; align-items: center; gap: var(--hint-gap); width: var(--layer-w); }
.layer.on {
  position: absolute; left: 50%; bottom: var(--bottom); transform: translateX(-50%); z-index: 2;
}
.layer.flow { position: relative; margin: 0 auto; }
.hint {
  margin: 0; text-align: center; line-height: 1.35; letter-spacing: .06em;
  font-family: "PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  font-size: var(--hint-px);
}
.hint.on-card { color: #5a2f24; text-shadow: 0 1px 0 rgba(255,248,232,.7); }
.hint.off-card { color: #fff3d2; text-shadow: 0 1px 6px rgba(0,0,0,.55); }
.btn {
  width: 100%; min-height: var(--btn-h); padding: 0 8px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  border: 1px solid #e6bb70; border-radius: 4px; color: #fff3d2;
  font-size: calc(var(--btn-h) * .34); font-weight: 600; letter-spacing: .18em;
  background: linear-gradient(90deg, #842016 0%, #b63c27 48%, #842016 100%);
  box-shadow: 0 0 0 1.5px #6b1c14, 0 0 0 2.5px #e6bb70, 0 4px 8px rgba(90,22,16,.32);
}
.arrow { width: 5px; height: 5px; border-right: 1.3px solid #e6bb70; border-top: 1.3px solid #e6bb70; transform: rotate(45deg); }
.actions { display: flex; flex-direction: column; gap: var(--act); width: 100%; }
.pill {
  width: 100%; border-radius: 999px; padding: 7px 8px; text-align: center;
  font-size: 10px; letter-spacing: .12em;
}
.pill.again { color: #f4efe4; background: rgba(20,14,10,.42); border: 1px solid rgba(244,239,228,.28); }
.pill.share {
  color: #5a2f18;
  background: linear-gradient(180deg, #f0d08a, #d4a24a);
  border: 1px solid #e6bb70;
}
.shot:target .phone, .shot.open .phone { outline: 2px solid #e4bc62; }
.lightbox {
  display: none; position: fixed; inset: 0; z-index: 20;
  background: rgba(8,6,4,.78); align-items: center; justify-content: center; padding: 24px;
}
.lightbox.show { display: flex; }
.lightbox .big { width: min(390px, 92vw); }
.lightbox .big .phone { aspect-ratio: 390 / 844; }
.lightbox h3 { margin: 0 0 10px; text-align: center; letter-spacing: .12em; }
.cap { margin: 0; font-size: .72rem; color: #9a8570; line-height: 1.45; }
</style>

const placeLabel = {on:"压卡上", below:"整层外", "split-hint":"提示外", "split-btn":"按钮外"};

function mock(v, scaleHint) {
  const stack = document.createElement("div");
  stack.className = "stack";
  const s = scaleHint || 0.55;
  stack.style.width = (v.card * s) + "px";
  stack.style.maxWidth = "100%";
  stack.style.setProperty("--bottom", v.bottom + "%");
  stack.style.setProperty("--layer-w", v.layerW + "%");
  stack.style.setProperty("--hint-gap", Math.max(4, v.hintGap * s) + "px");
  stack.style.setProperty("--stack", Math.max(4, v.stackGap * s) + "px");
  stack.style.setProperty("--act", Math.max(4, v.actGap * s) + "px");
  stack.style.setProperty("--btn-h", Math.max(22, v.btnH * s) + "px");
  stack.style.setProperty("--hint-px", Math.max(7, v.hintPx * s) + "px");

  const paper = document.createElement("div");
  paper.className = "paper";
  paper.innerHTML = `<img src="${CARD}" alt="" width="420" height="561" />`;

  const hintOn = `<p class="hint on-card">签已落定 · 点击查看签解</p>`;
  const hintOff = `<p class="hint off-card">签已落定 · 点击查看签解</p>`;
  const btn = `<button type="button" class="btn"><span>为我解签</span><i class="arrow"></i></button>`;

  if (v.place === "on") {
    const layer = document.createElement("div");
    layer.className = "layer on";
    layer.innerHTML = hintOn + btn;
    paper.appendChild(layer);
    stack.append(paper, actions());
  } else if (v.place === "below") {
    const layer = document.createElement("div");
    layer.className = "layer flow";
    layer.innerHTML = hintOff + btn;
    stack.append(paper, layer, actions());
  } else if (v.place === "split-hint") {
    const layer = document.createElement("div");
    layer.className = "layer on";
    layer.innerHTML = btn;
    paper.appendChild(layer);
    const hint = document.createElement("div");
    hint.innerHTML = hintOff;
    stack.append(paper, hint, actions());
  } else {
    const layer = document.createElement("div");
    layer.className = "layer on";
    layer.innerHTML = hintOn;
    paper.appendChild(layer);
    const out = document.createElement("div");
    out.className = "layer flow";
    out.innerHTML = btn;
    stack.append(paper, out, actions());
  }
  return stack;
}
function actions() {
  const el = document.createElement("div");
  el.className = "actions";
  el.innerHTML = `<div class="pill again">再来一签</div><div class="pill share">分享到想法</div>`;
  return el;
}
function phoneWrap(v, scale) {
  const phone = document.createElement("div");
  phone.className = "phone";
  const stage = document.createElement("div");
  stage.className = "stage";
  const stack = mock(v, scale);
  stage.appendChild(stack);
  phone.appendChild(stage);
  return phone;
}

const wall = document.getElementById("wall");
const box = document.getElementById("box");
const boxTitle = document.getElementById("boxTitle");
const boxBody = document.getElementById("boxBody");

V.forEach((v) => {
  const a = document.createElement("a");
  a.className = "shot";
  a.id = "r" + v.id;
  a.href = "#r" + v.id;
  a.dataset.place = v.place;
  if (v.id === "001") a.classList.add("is-old");
  if (v.id === "002") a.classList.add("is-now");
  a.innerHTML = `<h2><b>${v.id}</b>${v.name} · ${placeLabel[v.place]}</h2>`;
  a.appendChild(phoneWrap(v, 0.55));
  const cap = document.createElement("p");
  cap.className = "cap";
  cap.textContent = v.note || `卡${v.card} 底${v.bottom}% 缝${v.hintGap}/${v.stackGap}/${v.actGap} 钮${v.btnH}`;
  a.appendChild(cap);
  a.addEventListener("click", (e) => {
    e.preventDefault();
    history.replaceState(null, "", "#r" + v.id);
    boxTitle.textContent = v.id + "  " + v.name + "  ·  " + (v.note || placeLabel[v.place]);
    boxBody.replaceChildren(phoneWrap(v, 1));
    box.classList.add("show");
  });
  wall.appendChild(a);
});

box.addEventListener("click", () => box.classList.remove("show"));
document.querySelectorAll(".tools button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tools button").forEach((b) => b.classList.remove("on"));
    btn.classList.add("on");
    const f = btn.dataset.f;
    wall.querySelectorAll(".shot").forEach((el) => {
      el.style.display = (f === "all" || el.dataset.place === f) ? "" : "none";
    });
  });
});
