<html lang="zh-CN">

<meta charset="UTF-8" />

<title>出签流程与界面 · 100 版</title>
<style>
:root { --song: "Songti SC","STSong","SimSun","Noto Serif SC",serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #14110e; color: #f4eee6; font-family: var(--song); }
body { padding: 22px 14px 90px; }
.intro { max-width: 1280px; margin: 0 auto 18px; }
.intro h1 { margin: 0 0 8px; font-size: 1.4rem; letter-spacing: .14em; }
.intro p { margin: 0 0 8px; color: #c9b8a4; font-size: .95rem; line-height: 1.7; max-width: 54em; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tools button, .tools a {
  appearance: none; border: 1px solid rgba(243,235,224,.24); background: rgba(0,0,0,.28);
  color: #f3ebe0; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  font: inherit; font-size: .78rem; letter-spacing: .08em; text-decoration: none;
}
.tools button.on { background: #8a2c1c; border-color: #8a2c1c; }
.wall { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px 12px; }
.shot { display: flex; flex-direction: column; gap: 8px; cursor: pointer; color: inherit; text-decoration: none; }
.shot h2 { margin: 0; font-size: .78rem; font-weight: 500; color: rgba(243,235,224,.78); }
.shot h2 b { color: #f0c27a; margin-right: 6px; }
.shot.is-now h2 b { color: #7dcea0; }
.phone {
  width: 100%; aspect-ratio: 390 / 760; border-radius: 10px; overflow: hidden; position: relative;
  background: radial-gradient(ellipse 80% 46% at 50% 18%, rgba(90,62,28,.28), transparent 70%), linear-gradient(180deg,#3a2a1c,#1a140f 70%);
}
.stage { position: absolute; inset: 5% 7% 6%; display: flex; align-items: center; justify-content: center; }
.stack { display: flex; flex-direction: column; align-items: stretch; }
.paper { position: relative; width: 100%; line-height: 0; filter: drop-shadow(0 8px 14px rgba(0,0,0,.36)); }
.paper img { width: 100%; height: auto; display: block; }
.layer { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 78%; margin: 0 auto; }
.layer.on { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); width: 70%; }
.hint { margin: 0; color: #fff3d2; font-size: 9px; letter-spacing: .06em; text-align: center; text-shadow: 0 1px 6px #000; }
.hint.ink { color: #5a2f24; text-shadow: none; }
.red {
  width: 100%; min-height: 28px; display: flex; align-items: center; justify-content: center;
  border: 1px solid #e6bb70; border-radius: 4px; color: #fff3d2; font-size: 11px; letter-spacing: .08em;
  background: linear-gradient(90deg,#842016,#b63c27,#842016);
}
.meaning { margin: 0; padding: 7px 8px; border-radius: 8px; background: rgba(16,10,6,.46); color: #fff8ec; text-align: center; }
.meaning b { display: block; color: #f0c27a; font-size: 10px; letter-spacing: .2em; margin-bottom: 4px; }
.meaning p { margin: 0 0 6px; font-size: 9px; line-height: 1.45; }
.ai { width: 100%; border: 1px solid rgba(230,187,112,.7); border-radius: 999px; color: #f0c27a; background: transparent; padding: 5px; font-size: 10px; letter-spacing: .08em; text-align: center; }
.actions { display: flex; flex-direction: column; width: 100%; }
.actions.row { flex-direction: row; }
.pill { border-radius: 999px; padding: 6px 4px; text-align: center; font-size: 10px; letter-spacing: .08em; flex: 1; }
.pill.again { color: #f4efe4; background: rgba(20,14,10,.42); border: 1px solid rgba(244,239,228,.28); }
.pill.share { color: #5a2f18; background: linear-gradient(180deg,#f0d08a,#d4a24a); border: 1px solid #e6bb70; }
.pill.ai { color: #f0c27a; border: 1px solid rgba(230,187,112,.7); background: transparent; }
.sheet { width: 100%; padding: 10px 8px; border-radius: 12px; background: #1c1612; color: #f4eee6; text-align: center; }
.sheet img { width: 42%; height: auto; display: block; margin: 0 auto 8px; border-radius: 4px; }
.sheet .k { color: #e6bb70; letter-spacing: .2em; font-size: 10px; margin: 0 0 6px; }
.sheet .h { margin: 0 0 6px; color: rgba(244,238,230,.75); font-size: 9px; line-height: 1.45; }
.sheet .t { margin: 0 0 8px; padding: 6px; text-align: left; background: rgba(0,0,0,.28); border-radius: 6px; font-size: 9px; line-height: 1.45; white-space: pre-wrap; }
.sheet .s { display: flex; flex-direction: column; gap: 5px; }
.sheet .sb { border-radius: 999px; padding: 5px; font-size: 10px; }
.sheet .go { background: linear-gradient(180deg,#f6e4b4,#e4bc62); color: #1a1208; }
.sheet .ghost { color: #f4efe4; border: 1px solid rgba(244,239,228,.28); background: rgba(18,14,10,.42); }
.cap { margin: 0; font-size: .72rem; color: #9a8570; line-height: 1.45; }
.lightbox { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(8,6,4,.78); align-items: center; justify-content: center; padding: 24px; }
.lightbox.show { display: flex; }
.lightbox .big { width: min(390px, 92vw); }
.lightbox .big .phone { aspect-ratio: 390 / 844; }
.lightbox h3 { margin: 0 0 10px; text-align: center; letter-spacing: .1em; }
</style>
</head>

  <p><b style="color:#7dcea0">001–003</b> 是改之前。<b style="color:#f0c27a">095</b> 已接主流程（再来一签收成文字链）。点格子仍可对照。</p>

</div>

  wrap.style.width = (v.card * s) + "px";
  wrap.style.maxWidth = "100%";
  wrap.style.gap = Math.max(4, v.stack * s) + "px";

  if (v.state === "share") {
    const sheet = document.createElement("div");
    sheet.className = "sheet";
    const one = v.shareStyle === "one" || v.shareStyle === "text";
    sheet.innerHTML = `<p class="k">分享到想法</p>` +
      (v.shareStyle === "text" ? "" : `<img src="${CARD}" alt="" />`) +
      `<p class="h">${v.shareHint}</p>` +
      `<pre class="t">${COPY}</pre>` +
      `<div class="s">` +
      (one ? `<div class="sb go">去知乎发想法</div>` :
        `<div class="sb ghost">复制文案</div><div class="sb ghost">下载签卡</div><div class="sb go">去知乎发想法</div>`) +
      `</div>`;
    wrap.appendChild(sheet);
    return wrap;
  }

  const paper = document.createElement("div");
  paper.className = "paper";
  paper.innerHTML = `<img src="${CARD}" alt="" />`;
  const showRead = v.read !== "none";
  if (showRead) {
    const layer = document.createElement("div");
    layer.className = "layer" + (v.read === "on" ? " on" : "");
    const hint = document.createElement("p");
    hint.className = "hint" + (v.read === "on" ? " ink" : "");
    hint.textContent = "签已落定 · 点击查看签解";
    const red = document.createElement("div");
    red.className = "red";
    red.textContent = v.readLabel;
    layer.append(hint, red);
    if (v.read === "on") paper.appendChild(layer);
    wrap.appendChild(paper);
    if (v.read === "below") wrap.appendChild(layer);
  } else {
    wrap.appendChild(paper);
  }

  if (v.meaning) {
    const m = document.createElement("div");
    m.className = "meaning";
    m.innerHTML = `<b>签解</b><p>阶不在高，行则渐近。许多成长，都是回头时才发现已经发生。</p>`;
    if (v.flow === "expand-ai" || v.flow === "meaning-open") {
      const ai = document.createElement("div");
      ai.className = "ai";
      ai.textContent = v.aiLabel;
      m.appendChild(ai);
    }
    wrap.appendChild(m);
  }

  const acts = document.createElement("div");
  acts.className = "actions" + (v.flow === "row2" ? " row" : "");
  acts.style.gap = Math.max(4, v.act * s) + "px";
  const map = { again: v.againLabel, share: v.shareLabel, ai: v.aiLabel };
  const kinds = { again: "again", share: "share", ai: "ai" };
  (v.order || []).forEach((k) => acts.appendChild(pill(kinds[k] || "again", map[k] || k)));
  if (acts.childNodes.length) wrap.appendChild(acts);
  return wrap;
}
function phoneWrap(v, scale) {
  const phone = document.createElement("div");
  phone.className = "phone";
  const stage = document.createElement("div");
  stage.className = "stage";
  stage.appendChild(mock(v, scale));
  phone.appendChild(stage);
  return phone;
}
const wall = document.getElementById("wall");
const box = document.getElementById("box");
V.forEach((v) => {
  const a = document.createElement("a");
  a.className = "shot" + (["001","002","003"].includes(v.id) ? " is-now" : "");
  a.id = "f" + v.id;
  a.href = "#f" + v.id;
  a.dataset.state = v.state;
  a.dataset.flow = v.flow;
  a.innerHTML = `<h2><b>${v.id}</b>${v.name}</h2>`;
  a.appendChild(phoneWrap(v, 0.52));
  const cap = document.createElement("p");
  cap.className = "cap";
  cap.textContent = v.note || (v.state === "share" ? v.shareHint : `${v.flow} · 卡${v.card}`);
  a.appendChild(cap);
  a.addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("boxTitle").textContent = v.id + "  " + v.name;
    document.getElementById("boxBody").replaceChildren(phoneWrap(v, 1));
    box.classList.add("show");
  });
  wall.appendChild(a);
});
box.addEventListener("click", () => box.classList.remove("show"));
document.querySelectorAll(".tools button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tools button").forEach((b) => b.classList.remove("on"));
    btn.classList.add("on");
    const f = btn.dataset.f;
    wall.querySelectorAll(".shot").forEach((el) => {
      el.style.display = (f === "all" || el.dataset.state === f || el.dataset.flow === f) ? "" : "none";
    });
  });
});
</script>
</body>
</html>
